# Polaris on its own Hoster.by cloud server (project «Облако 32869»).
# Self-contained stack: Postgres + Rails (puma + solid_queue in puma) + Caddy (TLS).
#
#   docker compose up -d --build
#   docker compose exec web bin/rails db:prepare
#
# Domain: https://polarisclub.by (DNS A/AAAA -> this server's IP).

name: polaris

services:
  postgres:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: polaris
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: polaris_production
      TZ: Europe/Minsk
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command:
      - postgres
      - -c
      - max_connections=40
      - -c
      - shared_buffers=64MB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U polaris -d polaris_production"]
      interval: 5s
      timeout: 5s
      retries: 20
    shm_size: 64mb

  web:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: polaris-app
    container_name: polaris-app
    restart: unless-stopped
    env_file: .env
    environment:
      # Host for all four DBs (primary + cache/queue/cable in database.yml).
      DB_HOST: postgres
      POLARIS_DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      RAILS_ENV: production
      TZ: Europe/Minsk
      SOLID_QUEUE_IN_PUMA: "true"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - /opt/polaris/storage:/rails/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -H \"Host: $${APP_HOST}\" http://127.0.0.1/up || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      CADDY_EMAIL: ${CADDY_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
